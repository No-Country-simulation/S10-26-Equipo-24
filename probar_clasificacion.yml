name: Probar clasificación funcional

on:
  workflow_dispatch:
  push:
    branches:
      - yaneladata-patch-1
    paths:
      - clasificar_repositorios.py
      - .github/workflows/probar_clasificacion.yml

permissions:
  contents: read

jobs:
  clasificar:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Verificar sintaxis
        run: python -m py_compile clasificar_repositorios.py

      - name: Clasificar 10 repositorios
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python clasificar_repositorios.py

      - name: Verificar resultados
        run: |
          python - <<'PY'
          import csv

          with open(
              'data/propuestas_validacion.csv',
              encoding='utf-8-sig',
              newline=''
          ) as f:
              rows = list(csv.DictReader(f))

          assert len(rows) == 10, "Se esperaban 10 propuestas"

          validas = sum(
              bool(r["categoria_propuesta"].strip())
              for r in rows
          )

          print(f"Propuestas generadas: {len(rows)}")
          print(f"Con categoría propuesta: {validas}")

          if validas == 0:
              raise RuntimeError(
                  "No se pudo clasificar ningún repositorio"
              )
          PY

      - name: Guardar CSV como artefacto
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: propuestas-validacion-piloto
          path: data/propuestas_validacion.csv
          if-no-files-found: warn

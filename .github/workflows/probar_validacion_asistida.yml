
name: Probar validación funcional asistida

on:
  push:
    branches:
      - feature/validacion-asistida
    paths:
      - validar_funcionalmente.py
      - data/propuestas_validacion.csv
      - .github/workflows/probar_validacion_asistida.yml

permissions:
  contents: read

jobs:
  validar:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Verificar sintaxis
        run: python -m py_compile validar_funcionalmente.py

      - name: Generar revisión asistida
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python validar_funcionalmente.py

      - name: Verificar resultados
        run: |
          python - <<'PY'
          import csv
          from pathlib import Path

          archivo = Path("data/revision_funcional_asistida.csv")
          assert archivo.exists(), "No se generó el CSV"

          with archivo.open(encoding="utf-8-sig", newline="") as f:
              rows = list(csv.DictReader(f))

          assert len(rows) == 10, "Se esperaban 10 registros"
          assert len({r["repo_id"] for r in rows}) == 10, "Hay duplicados"
          assert all(r["estado_validacion"] == "Pendiente" for r in rows)

          print("10 registros generados correctamente")
          PY

      - name: Guardar resultados
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: revision-funcional-piloto
          path: data/revision_funcional_asistida.csv
          if-no-files-found: warn

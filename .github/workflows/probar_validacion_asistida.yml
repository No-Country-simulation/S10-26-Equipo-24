
name: Validacion funcional asistida

"on":
  workflow_dispatch:
  push:
    branches:
      - feature/validacion-asistida
    paths:
      - "validar_funcionalmente.py"
      - "data/propuestas_validacion.csv"
      - ".github/workflows/probar_validacion_asistida.yml"

permissions:
  contents: read

jobs:
  validar_repositorios:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests

      - name: Verificar sintaxis de Python
        run: |
          python -m py_compile validar_funcionalmente.py

      - name: Ejecutar validacion funcional
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python validar_funcionalmente.py

      - name: Comprobar CSV generado
        shell: bash
        run: |
          python - <<'PY'
          import csv
          from pathlib import Path

          entrada = Path("data/propuestas_validacion.csv")
          salida = Path("data/revision_funcional_asistida.csv")

          if not entrada.exists():
              raise FileNotFoundError(
                  "No existe data/propuestas_validacion.csv"
              )

          if not salida.exists():
              raise FileNotFoundError(
                  "No se genero el archivo de resultados"
              )

          with entrada.open(
              encoding="utf-8-sig", newline=""
          ) as archivo:
              originales = list(csv.DictReader(archivo))

          with salida.open(
              encoding="utf-8-sig", newline=""
          ) as archivo:
              resultados = list(csv.DictReader(archivo))

          if len(originales) != 100:
              raise ValueError(
                  f"Entrada: {len(originales)} registros; se esperaban 100"
              )

          if len(resultados) != 100:
              raise ValueError(
                  f"Salida: {len(resultados)} registros; se esperaban 100"
              )

          nombres = [
              fila["nombre_completo"].strip()
              for fila in resultados
          ]

          if len(set(nombres)) != 100:
              raise ValueError("Hay repositorios duplicados")

          if not all(
              fila["estado_validacion"] == "Pendiente"
              for fila in resultados
          ):
              raise ValueError(
                  "Hay repositorios no marcados como Pendiente"
              )

          if not all(
              fila["requiere_revision_humana"] == "Sí"
              for fila in resultados
          ):
              raise ValueError(
                  "Hay registros sin indicador de revision humana"
              )

          print("Validacion estructural completada")
          print("Repositorios procesados:", len(resultados))
          print("Todos pendientes de revision humana")
          PY

      - name: Descargar resultados como artefacto
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: revision-funcional-100-repositorios
          path: data/revision_funcional_asistida.csv
          if-no-files-found: warn
          retention-days: 14
